# Industry-grade NAR policy for malicious agent-skill detection (v2026-10-20).
# Shape: one yes/no question (Laya/Open-Jev/basal noul; SkillScreen-style NLI hypothesis)
# plus two label descriptions (GLiNER2.5-Decide). Kept short on purpose: encoder decision
# models share a 512-8192 token budget between this text and the skill itself.
# Grounding: NVIDIA SkillSpector v2 categories, MaliciousSkillBench harmonised taxonomy,
# MalSkillBench behaviours B1-B15, OWASP ASI Top 10 2026 (ASI01-ASI06, ASI10),
# CSA research note on SKILL.md context poisoning (2026-05). See README.md in this folder.
question: >
  Is this AI agent skill malicious? Treat it as malicious if its instructions, bundled
  scripts or referenced files try to make the agent do any of these without the user's
  informed consent: send secrets, files or conversation context to an outside destination;
  read credentials, keys, tokens or wallets; download and run remote or obfuscated code;
  add persistence such as cron jobs, shell hooks or edits to other context files
  (CLAUDE.md, AGENTS.md, memory); escalate privileges or auto-approve dangerous actions;
  hide what it does or suppress refusals and warnings; poison tool descriptions or memory;
  pull typosquatted or redirected dependencies; delete or encrypt data that was not
  requested. Transparent use of curl, environment variables, sudo, cron or the network
  that matches the skill's stated purpose and asks the user first is not malicious.
malicious: >
  An agent skill that exfiltrates data, context or credentials to an external endpoint;
  harvests API keys, SSH keys, tokens or wallets; downloads and executes remote or
  obfuscated code; installs persistence (cron, shell rc, hooks, writes to CLAUDE.md,
  AGENTS.md or memory files); escalates privileges, disables confirmations or
  auto-approves destructive actions; hides its behaviour, tells the agent not to inform
  the user, or suppresses refusals and safety warnings; plants hidden instructions in
  tool or MCP descriptions, images or invisible Unicode; uses typosquatted or redirected
  dependencies; or performs unrequested destructive, ransomware or crypto-mining actions.
benign: >
  An agent skill that performs a legitimate, clearly described task for the user. It may
  use curl, environment variables, sudo, cron, webhooks or network access as long as the
  use is visible in the instructions, matches the stated purpose, keeps secrets local and
  asks the user before sensitive or irreversible steps. Security tooling, test fixtures,
  pentest write-ups and documentation that describe attacks without instructing the agent
  to perform them are benign.
